services:
  postgres:
    image: postgres:16-alpine
    container_name: kapriz-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kapriz
      POSTGRES_PASSWORD: kapriz
      POSTGRES_DB: kapriz
    volumes:
      - kapriz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapriz -d kapriz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kapriz_postgres_data:
